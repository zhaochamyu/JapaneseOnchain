name: Close Stale Issues & PRs

on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 9am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            🌸 こんにちは！

            This issue has been automatically marked as **stale** because it has had no activity for **30 days**.

            If this issue is still relevant, please:
            - Leave a comment to keep it open
            - Add more details or context
            - Link it to a related discussion in our [Discussions board](https://github.com/zhaochamyu/JapaneseOnchain/discussions)

            If no activity occurs in the next **7 days**, this issue will be automatically closed.

            Thank you for contributing to JapaneseOnChain! 🌸⛓️
          close-issue-message: |
            🌸 This issue has been automatically closed due to **37 days of inactivity**.

            If this issue is still relevant, feel free to:
            - **Reopen** this issue with new information
            - **Start a discussion** in our [Community Discussions](https://github.com/zhaochamyu/JapaneseOnchain/discussions)
            - **Open a new issue** using our [issue templates](https://github.com/zhaochamyu/JapaneseOnchain/issues/new/choose)

            *「また会いましょう」— Until we meet again* 🌸
          close-issue-reason: not_planned

          # Pull Requests
          days-before-pr-stale: 21
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            🌸 こんにちは！

            This pull request has been automatically marked as **stale** because it has had no activity for **21 days**.

            To keep this PR open, please:
            - Push new commits or updates
            - Leave a comment with your progress
            - Request a review

            If no activity occurs in the next **7 days**, this PR will be automatically closed.

            Thank you for your contribution to JapaneseOnChain! 🌸⛓️
          close-pr-message: |
            🌸 This pull request has been automatically closed due to **28 days of inactivity**.

            Your work is appreciated! Feel free to reopen this PR or submit a new one when you are ready.

            *「また会いましょう」— Until we meet again* 🌸

          # Exemptions
          exempt-issue-labels: 'pinned,security,bug,priority: high,help wanted'
          exempt-pr-labels: 'pinned,security,priority: high'
          exempt-all-milestones: true

          # Limits
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
